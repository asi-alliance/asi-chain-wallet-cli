[package]
name = "asi-chain-wallet-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
node_cli = { git = "https://github.com/asi-alliance/asi-chain-client.git", rev = "9292f5433b4d727d9a226f2f5766dfd088e14948", default-features = false }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tempfile = "3"
secp256k1 = "0.31"
dotenv = "0.15"
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5"
lazy_static = "1.4"
csv = "1.3"

num-bigint = "0.4"

[features]
integration = []

[[test]]
name = "node_compatibility"
required-features = ["integration"]

[dev-dependencies]
rcgen = "0.13"
sha3 = "0.10.8"
hex = "0.4"
